<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">


<style>
  :root{
    --ground:#11322B;
    --ground-2:#0C2520;
    --chalk:#F0EDE2;
    --dim:rgba(240,237,226,.56);
    --faint:rgba(240,237,226,.30);
    --line:rgba(240,237,226,.13);
    --sunk:rgba(0,0,0,.16);
    --serif:"Fraunces",Georgia,"Times New Roman",serif;
    --sans:"Archivo","Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  #app{
    background:var(--ground);
    color:var(--chalk);
    font-family:var(--sans);
    font-size:15px;
    line-height:1.5;
    margin:0;
    padding:22px 16px 60px;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #app :focus-visible{outline:2px solid var(--chalk);outline-offset:2px;border-radius:3px}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  input,select{font:inherit;color:var(--chalk);background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:9px 10px;width:100%}
  input::placeholder{color:var(--faint)}

  /* ---- tabs ---- */
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:22px}
  .tabs button{
    padding:10px 2px 11px;margin-right:22px;font-size:14px;color:var(--faint);
    border-bottom:2px solid transparent;margin-bottom:-1px;letter-spacing:.01em;
  }
  .tabs button:hover{color:var(--dim)}
  .tabs button[aria-selected="true"]{color:var(--chalk);border-bottom-color:var(--chalk)}

  /* ---- pace ladder ---- */
  .pace{margin-top:2px}
  .pace-row{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:baseline;padding:9px 0;border-top:1px solid var(--line)}
  .pace-row:first-child{border-top:none}
  .pace-row .mn{font-size:14px}
  .pace-row .tg{font-family:var(--serif);font-weight:500;font-size:16px;font-variant-numeric:tabular-nums}
  .pace-row .ac{font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--faint);min-width:52px;text-align:right}
  .pace-row[data-state="past"] .mn,.pace-row[data-state="past"] .tg{color:var(--dim)}
  .pace-row[data-state="soon"]{margin:0 -14px;padding-left:14px;padding-right:14px;background:rgba(240,237,226,.05)}
  .pace-head{display:grid;grid-template-columns:1fr auto auto;gap:12px;padding-bottom:7px;color:var(--faint);font-size:11.5px}
  .pace-head span:last-child{min-width:52px;text-align:right}

  /* ---- timer ---- */
  .timer{border:1px solid var(--line);border-radius:12px;padding:20px 16px 18px;margin-bottom:16px;text-align:center;background:rgba(255,255,255,.017)}
  .timer .move{font-family:var(--serif);font-weight:500;font-size:25px;line-height:1.15;margin:0 0 2px;letter-spacing:-.01em}
  .timer .clock{font-family:var(--serif);font-weight:300;font-size:64px;line-height:1;font-variant-numeric:tabular-nums;margin:8px 0 4px}
  .timer .next{color:var(--dim);font-size:13px;min-height:19px}
  .timer .track{height:4px;border-radius:2px;background:rgba(0,0,0,.24);overflow:hidden;margin:16px 0 6px}
  .timer .track i{display:block;height:100%;background:var(--chalk);border-radius:2px}
  .timer .of{color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums}
  .timer .controls{display:flex;gap:9px;justify-content:center;margin-top:16px}
  .timer.resting .clock{color:#9AA9D6}

  .figbig{height:150px;margin:0 auto 4px;color:var(--chalk);opacity:.9}
  .figbig svg{height:100%;width:auto;display:block;margin:0 auto}
  .timer.resting .figbig{color:#9AA9D6}
  .figsm{width:34px;height:42px;flex:none;color:var(--dim)}
  .figsm svg{height:100%;width:100%}
  .move-row[data-cur="1"] .figsm{color:var(--chalk)}
  .move-row[data-past="1"] .figsm{opacity:.4}

  .moves{border:1px solid var(--line);border-radius:12px;padding:2px 14px;background:rgba(255,255,255,.017)}
  .move-row{display:flex;align-items:center;gap:11px;padding:11px 0;border-top:1px solid var(--line)}
  .move-row:first-child{border-top:none}
  .move-row .n{color:var(--faint);font-size:12px;width:16px;flex:none;font-variant-numeric:tabular-nums}
  .move-row .nm{flex:1;font-size:14.5px}
  .move-row .du{color:var(--dim);font-size:12.5px;font-variant-numeric:tabular-nums}
  .move-row.brk{padding:5px 0}
  .move-row.brk .nm{font-size:11.5px;color:var(--faint);padding-left:45px;letter-spacing:.03em}
  .move-row.brk[data-cur="1"] .nm{color:var(--chalk)}
  .move-row[data-cur="1"]{margin:0 -14px;padding-left:14px;padding-right:14px;background:rgba(240,237,226,.05)}
  .move-row[data-cur="1"] .nm{color:var(--chalk)}
  .move-row[data-past="1"] .nm,.move-row[data-past="1"] .du{color:var(--faint)}

  .logchips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;justify-content:center}

  /* ---- masthead ---- */
  .mast{border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:22px}
  .mast h1{
    font-family:var(--serif);font-weight:300;font-size:38px;line-height:.98;
    margin:0 0 10px;letter-spacing:-.015em;
  }
  .mast h1 em{font-style:italic;font-weight:500}
  .mast .span{color:var(--dim);font-size:13px;letter-spacing:.02em}
  .ticker{display:flex;align-items:baseline;gap:10px;margin-top:14px}
  .ticker b{font-family:var(--serif);font-weight:500;font-size:30px;line-height:1}
  .ticker span{color:var(--dim);font-size:13px}

  /* ---- sections ---- */
  section{margin-bottom:34px}
  .head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
  .head h2{font-family:var(--serif);font-weight:500;font-size:19px;margin:0;letter-spacing:-.01em}
  .head .aside{color:var(--dim);font-size:13px}

  /* ---- date stepper ---- */
  .stepper{display:flex;align-items:center;gap:8px;margin-bottom:16px}
  .stepper button{
    width:38px;height:38px;border:1px solid var(--line);border-radius:8px;
    font-size:17px;line-height:1;flex:none;color:var(--dim)
  }
  .stepper button:hover:not(:disabled){color:var(--chalk);border-color:var(--faint)}
  .stepper button:disabled{opacity:.28;cursor:default}
  .stepper .when{flex:1;text-align:center}
  .stepper .when b{display:block;font-family:var(--serif);font-weight:500;font-size:17px}
  .stepper .when span{display:block;color:var(--dim);font-size:12px;margin-top:1px}

  /* ---- person card ---- */
  .card{border:1px solid var(--line);border-radius:12px;padding:14px 14px 12px;margin-bottom:12px;background:rgba(255,255,255,.017)}
  .card .who{display:flex;align-items:center;gap:9px;margin-bottom:12px}
  .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .who b{font-family:var(--serif);font-weight:500;font-size:17px;letter-spacing:-.01em}
  .who .tally{margin-left:auto;color:var(--dim);font-size:12.5px;font-variant-numeric:tabular-nums}

  .task{
    display:flex;align-items:center;gap:11px;width:100%;text-align:left;
    padding:10px 4px;border-top:1px solid var(--line);
  }
  .task:first-of-type{border-top:none}
  .task .box{
    width:22px;height:22px;border-radius:6px;border:1.5px solid var(--faint);flex:none;
    display:grid;place-items:center;transition:background .13s,border-color .13s;
  }
  .task .box svg{width:12px;height:12px;opacity:0;transform:scale(.7);transition:opacity .13s,transform .13s}
  .task[data-on="1"] .box svg{opacity:1;transform:scale(1)}
  .task .label{flex:1;font-size:14.5px}
  .task[data-on="1"] .label{color:var(--dim)}
  .task .meta{color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums}
  .task:disabled{cursor:default}
  .task:disabled .box{opacity:.3}
  .task:disabled .label{color:var(--faint)}

  /* ---- season strip ---- */
  .strip{margin-top:2px}
  .strip-row{display:grid;grid-template-columns:30px 1fr;align-items:center;gap:8px;margin-bottom:3px}
  .strip-row .mo{font-size:10.5px;color:var(--faint);letter-spacing:.04em}
  .cells{display:grid;grid-template-columns:repeat(31,1fr);gap:2px}
  .cell{aspect-ratio:1;border-radius:1.5px;background:rgba(240,237,226,.055)}
  .cell.blank{background:none}
  .cell.future{background:rgba(240,237,226,.035)}
  .cell.today{box-shadow:0 0 0 1.5px var(--chalk)}
  .legend{display:flex;gap:14px;color:var(--faint);font-size:11.5px;margin-top:9px;flex-wrap:wrap}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:1.5px;margin-right:5px;vertical-align:-1px}

  /* ---- weight ---- */
  .weigh{border-top:1px solid var(--line);margin-top:10px;padding-top:12px}
  .bar{height:5px;border-radius:3px;background:rgba(0,0,0,.22);overflow:hidden;margin:9px 0 7px}
  .bar i{display:block;height:100%;border-radius:3px}
  .weigh .row{display:flex;align-items:center;gap:8px}
  .weigh .row input{flex:1}
  .weigh .row button{border:1px solid var(--line);border-radius:6px;padding:9px 13px;font-size:13.5px;color:var(--dim);flex:none}
  .weigh .row button:hover{color:var(--chalk)}
  .weigh .caption{color:var(--dim);font-size:12.5px;font-variant-numeric:tabular-nums}

  /* ---- buttons ---- */
  .ghost{border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:13.5px;color:var(--dim)}
  .ghost:hover{color:var(--chalk);border-color:var(--faint)}
  .solid{background:var(--chalk);color:var(--ground);border-radius:8px;padding:11px 16px;font-size:14px;font-weight:500}
  .linky{color:var(--dim);font-size:12.5px;text-decoration:underline;text-underline-offset:3px}
  .linky:hover{color:var(--chalk)}

  /* ---- notice ---- */
  .notice{border:1px solid var(--line);border-left:2px solid var(--chalk);border-radius:8px;padding:13px 14px;margin-bottom:22px}
  .notice p{margin:0;font-size:14px}
  .notice p+p{margin-top:6px;color:var(--dim);font-size:13px}

  /* ---- editor ---- */
  .scrim{position:fixed;inset:0;background:rgba(6,20,17,.72);display:grid;place-items:end center;padding:0;z-index:20}
  .sheet{
    background:var(--ground-2);border-top:1px solid var(--line);border-radius:16px 16px 0 0;
    width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:18px 16px 26px;
  }
  .sheet h3{font-family:var(--serif);font-weight:500;font-size:21px;margin:0 0 16px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12.5px;color:var(--dim);margin-bottom:5px}
  .hab{display:flex;gap:7px;margin-bottom:7px}
  .hab input[type=number]{width:66px;flex:none;text-align:center}
  .hab button{border:1px solid var(--line);border-radius:6px;width:38px;flex:none;color:var(--faint);font-size:16px}
  .hab button:hover{color:var(--chalk)}
  .swatches{display:flex;gap:8px;flex-wrap:wrap}
  .swatch{width:30px;height:30px;border-radius:50%;border:2px solid transparent}
  .swatch[aria-pressed="true"]{border-color:var(--chalk)}
  .sheet-foot{display:flex;gap:10px;align-items:center;margin-top:20px}
  .sheet-foot .solid{flex:1}

  .fine{color:var(--faint);font-size:12px;line-height:1.55;border-top:1px solid var(--line);padding-top:14px}

  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
  @media (min-width:620px){
    #app{padding:34px 28px 70px;max-width:760px;margin:0 auto}
    .mast h1{font-size:52px}
    .strip-row{grid-template-columns:38px 1fr;gap:10px}
  }
</style>

<div id="app"><div id="root"></div></div>

<script>
(function(){
  "use strict";

  var START = "2026-10-01";
  var END   = "2027-04-18";
  var PRE_START = "2026-09-01";
  var PRE_END   = "2026-09-30";
  var HUES  = ["#E8A05C","#7FB3A0","#D98B8B","#C7BE64","#9AA9D6","#DDA0C4","#8FC4C9","#E0B87F"];
  var MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var FULL = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  var DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

  /* ---------- dates (all local, no UTC drift) ---------- */
  function key(d){
    var m = d.getMonth()+1, day = d.getDate();
    return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(day<10?"0":"")+day;
  }
  function parse(s){ var p = s.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
  function shift(s, n){ var d = parse(s); d.setDate(d.getDate()+n); return key(d); }
  function span(a, b){ return Math.round((parse(b)-parse(a))/86400000); }
  function today(){ return key(new Date()); }
  function longDate(s){ var d = parse(s); return d.getDate()+" "+FULL[d.getMonth()]+" "+d.getFullYear(); }
  function shortDate(s){ var d = parse(s); return d.getDate()+" "+MONTHS[d.getMonth()]; }
  function pretty(s){ var d = parse(s); return DAYS[d.getDay()]+", "+MONTHS[d.getMonth()]+" "+d.getDate(); }
  function mondayOf(s){ var d = parse(s); var w = (d.getDay()+6)%7; d.setDate(d.getDate()-w); return key(d); }
  var TOTAL = span(START, END) + 1;
  var PRE_TOTAL = span(PRE_START, PRE_END) + 1;

  /* ---------- state ---------- */
  var state = { roster: [], logs: {}, cursor: today(), preCursor: today(), editing: null, ready: false, warn: "",
                tab: "today", routine: null, editRoutine: null,
                timer: { on:false, i:0, left:0, done:false } };

  // secs:0 means open-ended — the clock counts up until you tap Finish.
  function seedRoutine(){
    var work = [
      ["High knees",60],["Lunges",60],["Cross-arm movements",60],["Up-down arm movements",60],
      ["Rest",60],["Straight-arm punches",60],["Upper cuts",60],
      ["Balance on right foot",60],["Balance on left foot",60],["Jump rope",60],
      ["Stretching",0]
    ];
    var moves = [];
    work.forEach(function(w,i){
      if(i) moves.push({ label:"Break", secs:15 });
      moves.push({ label:w[0], secs:w[1] });
    });
    return { name:"The daily routine", moves:moves };
  }
  function isBreak(mv){ return /^break$/i.test(String(mv.label||"").trim()); }
  function isOpen(mv){ return !mv.secs; }

  function seed(){
    return [
      { id:"michelle", name:"Michelle", hue:HUES[0], goalLbs:20, start:180,
        daily:[{id:"am",label:"Morning routine (10 min)"},{id:"pm",label:"Evening routine (10 min)"}],
        weekly:[{id:"lift",label:"Weights",times:3}] },
      { id:"john", name:"John", hue:HUES[1], goalLbs:20, start:201,
        daily:[{id:"am",label:"Morning routine (10 min)"},{id:"pm",label:"Evening routine (10 min)"}],
        weekly:[] },
      { id:"haley", name:"Haley", hue:HUES[2], goalLbs:0, start:null,
        daily:[],
        weekly:[{id:"cardio",label:"Cardio",times:1},{id:"pilates",label:"Pilates",times:2}] }
    ];
  }

  function blankLog(){ return { days:{}, weights:{} }; }

  /* ---------- storage ---------- */
  function has(){ return typeof window !== "undefined" && window.storage; }

  async function load(){
    if(!has()){ state.roster = seed(); state.routine = seedRoutine(); state.warn = "Storage is unavailable, so nothing you enter will be kept."; return; }
    var roster = null;
    try{
      var r = await window.storage.get("fc:roster", true);
      if(r && r.value) roster = JSON.parse(r.value);
    }catch(e){ roster = null; }

    if(!roster || !roster.length){
      roster = seed();
      try{ await window.storage.set("fc:roster", JSON.stringify(roster), true); }
      catch(e){ state.warn = "Couldn't reach storage. Changes may not stick — try reloading."; }
    }
    state.roster = roster;

    var SEEDED = { michelle:180, john:201 }, patched = false;
    var mig = null;
    try{ var mg = await window.storage.get("fc:mig", true); mig = mg && mg.value; }catch(e){ mig = null; }
    var fresh = mig !== "4";
    if(fresh){
      if(!roster.some(function(m){ return m.id === "haley"; })){
        roster.push(seed().filter(function(m){ return m.id === "haley"; })[0]);
        patched = true;
      }
      // corrected weigh-ins take precedence over whatever was stored
      roster.forEach(function(m){
        if(SEEDED[m.id] !== undefined && m.start !== SEEDED[m.id]){ m.start = SEEDED[m.id]; patched = true; }
      });
      try{ await window.storage.set("fc:mig", "4", true); }catch(e){}
    }
    if(patched){ try{ await window.storage.set("fc:roster", JSON.stringify(roster), true); }catch(e){} }

    for(var i=0;i<roster.length;i++){
      var m = roster[i];
      try{
        var g = await window.storage.get("fc:log:"+m.id, true);
        state.logs[m.id] = (g && g.value) ? JSON.parse(g.value) : blankLog();
      }catch(e){ state.logs[m.id] = blankLog(); }
    }

    try{
      var rt = await window.storage.get("fc:routine", true);
      state.routine = (rt && rt.value) ? JSON.parse(rt.value) : null;
    }catch(e){ state.routine = null; }
    if(fresh || !state.routine || !state.routine.moves || !state.routine.moves.length){
      state.routine = seedRoutine();
      try{ await window.storage.set("fc:routine", JSON.stringify(state.routine), true); }catch(e){}
    }
  }

  async function saveRoutine(){
    if(!has()) return;
    try{ await window.storage.set("fc:routine", JSON.stringify(state.routine), true); }
    catch(e){ flash("Couldn't save the routine. Check your connection and try again."); }
  }

  async function saveRoster(){
    if(!has()) return;
    try{ await window.storage.set("fc:roster", JSON.stringify(state.roster), true); }
    catch(e){ flash("Couldn't save that. Check your connection and try again."); }
  }
  async function saveLog(id){
    if(!has()) return;
    try{ await window.storage.set("fc:log:"+id, JSON.stringify(state.logs[id]), true); }
    catch(e){ flash("Couldn't save that. Check your connection and try again."); }
  }
  function flash(msg){ state.warn = msg; draw(); }

  /* ---------- derived ---------- */
  function inSeason(d){ return d >= START && d <= END; }
  function inPre(d){ return d >= PRE_START && d <= PRE_END; }
  function inAny(d){ return inSeason(d) || inPre(d); }
  function bounds(which){ return which === "pre" ? [PRE_START, PRE_END] : [START, END]; }
  function cursorOf(which){ return which === "pre" ? state.preCursor : state.cursor; }

  // Pre-season is counted on its own and never folded into the challenge numbers.
  function preKept(m){
    var n = 0, d = PRE_START;
    for(var i=0;i<PRE_TOTAL;i++){ if(fillFor(m,d) >= 1) n++; d = shift(d,1); }
    return n;
  }
  function preElapsed(){
    var t = today();
    if(t < PRE_START) return 0;
    if(t > PRE_END) return PRE_TOTAL;
    return span(PRE_START,t)+1;
  }
  function isFuture(d){ return d > today(); }

  function dayDone(m, d){
    var log = state.logs[m.id] || blankLog();
    var rec = log.days[d] || [];
    var out = [];
    for(var i=0;i<m.daily.length;i++) if(rec.indexOf(m.daily[i].id) > -1) out.push(m.daily[i].id);
    return out;
  }
  function ticked(m, d, id){
    var rec = (state.logs[m.id] || blankLog()).days[d] || [];
    return rec.indexOf(id) > -1;
  }
  function weekCount(m, d, id){
    var mon = mondayOf(d), n = 0;
    for(var i=0;i<7;i++){ if(ticked(m, shift(mon,i), id)) n++; }
    return n;
  }
  // A day is "full" when the daily habits are done. Weekly habits (e.g. weights 3x)
  // add credit on the days they happen but never count against the days they don't.
  function fillFor(m, d){
    var rec = (state.logs[m.id] || blankLog()).days[d] || [];
    if(!rec.length) return 0;
    var n = 0, i;
    for(i=0;i<m.daily.length;i++) if(rec.indexOf(m.daily[i].id) > -1) n++;
    for(i=0;i<m.weekly.length;i++) if(rec.indexOf(m.weekly[i].id) > -1) n++;
    var base = m.daily.length || 1;
    return Math.min(1, n/base);
  }
  // Someone with only weekly goals is scored on weeks hit, not days kept.
  function weeklyOnly(m){ return !m.daily.length && m.weekly.length > 0; }
  function weekTarget(m){ return m.weekly.reduce(function(a,b){ return a + b.times; }, 0); }
  function weekDone(m, d){
    return m.weekly.reduce(function(a,b){ return a + Math.min(b.times, weekCount(m, d, b.id)); }, 0);
  }
  function weekHit(m, d){
    return m.weekly.every(function(h){ return weekCount(m, d, h.id) >= h.times; });
  }
  function firstMonday(from){ var d = from; while(parse(d).getDay() !== 1) d = shift(d,1); return d; }
  function weekTally(m, lo, hi){
    var t = today(); if(t > hi) t = hi;
    if(t < lo) return { hit:0, total:0 };
    var w = firstMonday(lo), hit = 0, total = 0;
    while(shift(w,6) <= t){ total++; if(weekHit(m, w)) hit++; w = shift(w,7); }
    return { hit:hit, total:total };
  }

  function streak(m){
    var d = today(); if(d > END) d = END;
    if(d < START) return 0;
    var n = 0;
    while(d >= START){
      if(fillFor(m,d) >= 1) n++;
      else if(d !== today()) break;
      d = shift(d,-1);
    }
    return n;
  }
  function elapsed(){
    var t = today();
    if(t < START) return 0;
    if(t > END) return TOTAL;
    return span(START,t)+1;
  }
  function consistency(m){
    var e = elapsed(); if(!e) return null;
    var sum = 0, d = START;
    for(var i=0;i<e;i++){ sum += fillFor(m,d); d = shift(d,1); }
    return Math.round((sum/e)*100);
  }
  // Targets interpolate by elapsed day, so the last one lands exactly on the goal
  // even when the challenge ends mid-month.
  function checkpoints(m){
    if(!m.start || !m.goalLbs) return [];
    var run = span(START, END);
    if(run <= 0) return [];
    function mark(k){
      return { key:k, label:shortDate(k),
               target: Math.round((m.start - m.goalLbs*span(START,k)/run)*10)/10,
               first: k === START, final: k === END };
    }
    var out = [], a = parse(START), e = parse(END);
    var y = a.getFullYear(), mo = a.getMonth();
    while(y < e.getFullYear() || (y === e.getFullYear() && mo <= e.getMonth())){
      var k = key(new Date(y, mo, 1));
      if(k >= START && k <= END) out.push(mark(k));
      mo++; if(mo > 11){ mo = 0; y++; }
    }
    if(!out.length || out[out.length-1].key !== END) out.push(mark(END));
    return out;
  }
  function weightAt(m, dk){
    var w = (state.logs[m.id] || blankLog()).weights || {};
    var ks = Object.keys(w).sort(), best = null;
    for(var i=0;i<ks.length;i++){ if(ks[i] <= dk) best = w[ks[i]]; }
    return best;
  }
  function nextCheckpoint(m){
    var cp = checkpoints(m), t = today();
    for(var i=0;i<cp.length;i++) if(cp[i].key > t) return cp[i];
    return cp.length ? cp[cp.length-1] : null;
  }

  function weightNow(m){
    var log = state.logs[m.id] || blankLog();
    var ks = Object.keys(log.weights||{}).sort();
    return ks.length ? log.weights[ks[ks.length-1]] : null;
  }

  /* ---------- render ---------- */
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  var CHECK = '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.8 6.4 4.4 9 10.2 2.9"/></svg>';

  function masthead(){
    var t = today(), line, num, cap;
    if(t < START){ num = span(t,START); cap = num === 1 ? "day until it starts" : "days until it starts"; }
    else if(t > END){ num = TOTAL; cap = "days, done"; }
    else { num = span(START,t)+1; cap = "of "+TOTAL+" days"; }
    line = longDate(START)+" &ndash; "+longDate(END);
    return '<div class="mast">'+
      '<h1>The Long <em>Season</em></h1>'+
      '<div class="span">'+line+'</div>'+
      '<div class="ticker"><b>'+num+'</b><span>'+cap+'</span></div>'+
    '</div>';

  function notice(){
    var out = "";

      out += '<div class="notice"><p>'+esc(state.warn)+'</p></div>';

      out += '<div class="notice">'+
        '<p>Check-ins open on 1 October.</p>'+
        '<p>Use the Pre-season tab to start counting September days now.</p>'+
      '</div>';
    }
    return out;
  }

  function stepper(which){
    var b = bounds(which), lo = b[0], hi = b[1], d = cursorOf(which);
    var back = d > lo, fwd = d < hi && !isFuture(shift(d,1));
    var total = which === "pre" ? PRE_TOTAL : TOTAL;
    var tag = d === today() ? "Today"
            : (d === shift(today(),-1) ? "Yesterday"
            : "Day "+(span(lo,d)+1)+" of "+total);
    return '<div class="stepper">'+
      '<button data-step="-1" data-which="'+which+'"'+(back?"":" disabled")+' aria-label="Previous day">&#8592;</button>'+
      '<div class="when"><b>'+pretty(d)+'</b><span>'+tag+'</span></div>'+
      '<button data-step="1" data-which="'+which+'"'+(fwd?"":" disabled")+' aria-label="Next day">&#8594;</button>'+
    '</div>';
  }

  function taskRow(m, item, kind, d){
    var on = ticked(m, d, item.id);
    var lock = isFuture(d) || !inAny(d);
    var meta = "";
    if(kind === "weekly"){
      var n = weekCount(m, d, item.id);
      meta = '<span class="meta">'+n+'/'+item.times+' this week</span>';
    }
    return '<button class="task" data-on="'+(on?1:0)+'" data-who="'+m.id+'" data-item="'+item.id+'"'+(lock?" disabled":"")+
      ' data-day="'+d+'" aria-pressed="'+(on?"true":"false")+'">'+
      '<span class="box" style="'+(on?"background:"+m.hue+";border-color:"+m.hue+";color:"+"#0C2520":"")+'">'+CHECK+'</span>'+
      '<span class="label">'+esc(item.label)+'</span>'+meta+
    '</button>';
  }

  function weighRow(m){
    var goal = m.goalLbs || 0;
    if(!goal) return "";
    var now = weightNow(m), start = m.start;
    var body = "";
    if(start && now != null){
      var lost = Math.max(0, start - now);
      var pct = Math.min(100, Math.round((lost/goal)*100));
      body = '<div class="bar"><i style="width:'+pct+'%;background:'+m.hue+'"></i></div>'+
        '<div class="caption">'+lost.toFixed(1)+' of '+goal+' lb &middot; now '+now+' lb</div>';
      var nx = nextCheckpoint(m);
      if(nx) body += '<div class="caption" style="color:var(--faint);margin-top:3px">By '+nx.label+': '+nx.target+' lb</div>';
    } else if(start){
      body = '<div class="caption">Started at '+start+' lb. Goal: '+goal+' lb.</div>';
    } else {
      body = '<div class="caption">Goal: '+goal+' lb. Add a weight to start tracking.</div>';
    }
    return '<div class="weigh">'+body+
      '<div class="row" style="margin-top:9px">'+
        '<input type="number" step="0.1" inputmode="decimal" placeholder="Weight in lb" data-w="'+m.id+'" aria-label="Weight for '+esc(m.name)+'">'+
        '<button data-logw="'+m.id+'">Log</button>'+
      '</div>'+
    '</div>';
  }

  function checkCards(d, which){
    return state.roster.map(function(m){
      var done = dayDone(m, d).length, total = m.daily.length;
      var rows = m.daily.map(function(i){ return taskRow(m,i,"daily",d); }).join("")
               + m.weekly.map(function(i){ return taskRow(m,i,"weekly",d); }).join("");
      var tally;
      if(weeklyOnly(m)) tally = weekDone(m,d)+" of "+weekTarget(m)+" this week";
      else if(which === "pre") tally = preKept(m)+" of "+preElapsed()+" days";
      else tally = streak(m) ? streak(m)+" day streak" : done+"/"+total+" today";
      return '<div class="card">'+
        '<div class="who">'+
          '<span class="dot" style="background:'+m.hue+'"></span>'+
          '<b>'+esc(m.name)+'</b>'+
          '<span class="tally">'+tally+'</span>'+
        '</div>'+rows+(which === "pre" ? preWeigh(m) : weighRow(m))+
      '</div>';
    }).join("");
  }

  function preWeigh(m){
    if(!m.goalLbs) return "";
    var now = weightNow(m);
    var matches = now != null && m.start != null && Math.abs(now - m.start) < 0.05;
    return '<div class="weigh">'+
      '<div class="caption">'+(now != null
        ? "Now "+now+" lb &middot; will start at "+(m.start != null ? m.start+" lb" : "&mdash;")
        : "No weight logged yet.")+'</div>'+
      (now != null && !matches ? '<button class="linky" data-restart="'+m.id+'" style="margin-top:6px">Start the challenge from '+now+' lb instead</button>' : "")+
      '<div class="row" style="margin-top:9px">'+
        '<input type="number" step="0.1" inputmode="decimal" placeholder="Weight in lb" data-w="'+m.id+'" aria-label="Weight for '+esc(m.name)+'">'+
        '<button data-logw="'+m.id+'">Log</button>'+
      '</div>'+
    '</div>';
  }

  function preStrip(m){
    var cells = "", a = parse(PRE_START);
    for(var day=1; day<=PRE_TOTAL; day++){
      var k = key(new Date(a.getFullYear(), a.getMonth(), day));
      var cls = "cell", style = "";

      else { var f = fillFor(m,k); if(f > 0) style = 'background:'+m.hue+';opacity:'+(0.3+f*0.7).toFixed(2)+';'; }

  function stripFor(m){
    var rows = "", d = parse(START), endD = parse(END);
    var y = d.getFullYear(), mo = d.getMonth();
    while(y < endD.getFullYear() || (y === endD.getFullYear() && mo <= endD.getMonth())){
      var dim = new Date(y, mo+1, 0).getDate();
      var cells = "";
      for(var day=1; day<=31; day++){
        if(day > dim){ cells += '<div class="cell blank"></div>'; continue; }
        var k = key(new Date(y, mo, day));
        if(!inSeason(k)){ cells += '<div class="cell blank"></div>'; continue; }
        var cls = "cell", style = "";
        if(isFuture(k)) cls += " future";
        else {
          var f = fillFor(m, k);
          if(f > 0) style = 'background:'+m.hue+';opacity:'+(0.3 + f*0.7).toFixed(2)+';';
        }
        if(k === today()) cls += " today";
        cells += '<div class="'+cls+'" style="'+style+'" title="'+k+'"></div>';
      }
      rows += '<div class="strip-row"><div class="mo">'+MONTHS[mo]+'</div><div class="cells">'+cells+'</div></div>';
      mo++; if(mo > 11){ mo = 0; y++; }
    }
    return rows;
  }

  function paceCard(m){

    var t = today(), nx = nextCheckpoint(m);
    var rows = cp.map(function(c){
      var st = c.key <= t ? "past" : (nx && c.key === nx.key ? "soon" : "ahead");
      var act = c.key <= t ? weightAt(m, c.key) : null;
      var label = c.label + (c.first ? " &middot; start" : (c.final ? " &middot; goal" : ""));
      return '<div class="pace-row" data-state="'+st+'">'+

        '<span class="tg" style="'+(st==="soon"?"color:"+m.hue:"")+'">'+c.target.toFixed(1)+'</span>'+

  function artFor(label){
    var s = String(label||"").toLowerCase();
    if(/balance/.test(s)) return /left/.test(s) ? ART.balanceL : ART.balanceR;
    if(/jump *rope|skip/.test(s)) return ART.rope;
    if(/high *knee|knee/.test(s)) return ART.knees;
    if(/lunge/.test(s)) return ART.lunge;
    if(/cross/.test(s)) return ART.cross;
    if(/up *-? *down|overhead|raise/.test(s)) return ART.updown;
    if(/rest|break|breathe|recover|water/.test(s)) return ART.rest;
    if(/upper *-? *cut|hook/.test(s)) return ART.upper;
    if(/punch|jab|straight/.test(s)) return ART.punch;
    if(/stretch|cool|mobility/.test(s)) return ART.stretch;
    return ART.generic;
  }

  function mmss(s){ var m = Math.floor(s/60), r = s%60; return m+":"+(r<10?"0":"")+r; }

    return state.routine.moves.reduce(function(a,b){ return a + b.secs; }, 0);
  }
  function elapsedSecs(){
    var r = state.routine.moves, n = 0;
    for(var i=0;i<state.timer.i;i++) n += r[i].secs || 0;
    var cur = r[state.timer.i];
    if(cur && cur.secs) n += cur.secs - state.timer.left;
    return n;
  }

  function timerPanel(){
    var r = state.routine.moves, tm = state.timer;
    var total = routineTotal();

    if(tm.done){
      var chips = state.roster.map(function(m){
        var slot = new Date().getHours() < 14 ? "am" : "pm";
        var item = m.daily.filter(function(h){ return h.id === slot; })[0] || m.daily[0];
        if(!item) return "";
        return '<button class="ghost" data-credit="'+m.id+'" data-slot="'+item.id+'">Log for '+esc(m.name)+'</button>';
      }).join("");
      return '<div class="timer">'+
        '<p class="move">That&rsquo;s '+mmss(total)+'.</p>'+
        '<div class="next" style="margin-top:6px">'+r.filter(function(x){ return !isBreak(x); }).length+' moves, '+mmss(total)+' on the clock.</div>'+
        (chips ? '<div class="logchips">'+chips+'</div>' : "")+
        '<div class="controls"><button class="linky" data-treset="1">Run it again</button></div>'+
      '</div>';
    }

    var cur = r[tm.i] || r[0];
    var nxt = r[tm.i+1];
    var left = tm.left || cur.secs;
    var pct = total ? Math.round((elapsedSecs()/total)*100) : 0;
    var resting = /rest|stretch|break/i.test(cur.label);
    var open = isOpen(cur);
    var started = tm.on || elapsedSecs() > 0;

    return '<div class="timer'+(resting?" resting":"")+'">'+
      '<div class="figbig">'+artFor(cur.label)+'</div>'+
      '<p class="move" id="t-move">'+esc(cur.label)+'</p>'+
      '<div class="clock" id="t-clock">'+mmss(open ? tm.left : left)+'</div>'+
      '<div class="next" id="t-next">'+(open ? "Take as long as you like" : (nxt ? "Next: "+esc(nxt.label) : "Last one"))+'</div>'+
      '<div class="track"><i id="t-bar" style="width:'+pct+'%"></i></div>'+
      '<div class="of" id="t-of">'+mmss(elapsedSecs())+' of '+mmss(total)+'</div>'+
      '<div class="controls">'+
        '<button class="solid" data-'+(open && started ? 'tdone' : 'tplay')+'="1">'+
          (open && started ? "Finish" : (tm.on ? "Pause" : (started ? "Resume" : "Start")))+'</button>'+
        (started ? '<button class="ghost" data-treset="1">Reset</button>' : "")+
        (started && !open ? '<button class="ghost" data-tskip="1">Skip</button>' : "")+
      '</div>'+
    '</div>';
  }

  function workoutsSection(){
    var r = state.routine.moves, tm = state.timer;
    var num = 0;
    var rows = r.map(function(mv,i){
      var cur = (!tm.done && i === tm.i && (tm.on || elapsedSecs() > 0)) ? 1 : 0;
      var past = (tm.done || i < tm.i) ? 1 : 0;
      if(isBreak(mv)){
        return '<div class="move-row brk" data-cur="'+cur+'" data-past="'+past+'">'+
          '<span class="nm">'+mv.secs+'s break</span></div>';
      }
      num++;
      return '<div class="move-row" data-cur="'+cur+'" data-past="'+past+'">'+
        '<span class="n">'+num+'</span>'+
        '<span class="figsm">'+artFor(mv.label)+'</span>'+
        '<span class="nm">'+esc(mv.label)+'</span>'+
        '<span class="du">'+(isOpen(mv) ? "no limit" : mmss(mv.secs))+'</span>'+
      '</div>';
    }).join("");
    return '<section>'+
      '<div class="head"><h2>'+esc(state.routine.name)+'</h2><div class="aside">morning and evening</div></div>'+
      timerPanel()+
      '<div class="moves">'+rows+'</div>'+
      '<div style="display:flex;gap:10px;align-items:center;margin-top:14px">'+
        '<button class="ghost" data-editr="1">Change the routine</button>'+
        '<span style="color:var(--faint);font-size:12px">'+mmss(routineTotal())+' + stretching</span>'+
      '</div>'+
      '<div class="fine" style="margin-top:24px">Ticking a routine off in Today is what counts toward the challenge &mdash; the timer is just here to run it. Sit a move out or swap it if something hurts.</div>'+
    '</section>';
  }

  function routineEditor(){
    if(!state.editRoutine) return "";
    var r = state.editRoutine;
    var rows = r.moves.map(function(mv,i){
      return '<div class="hab">'+
        '<input value="'+esc(mv.label)+'" data-mv="'+i+'" placeholder="Move">'+
        '<input type="number" min="0" max="60" step="0.25" value="'+Math.round(mv.secs/60*100)/100+'" data-mvm="'+i+'" aria-label="Minutes, 0 for no limit">'+
        '<button data-mvrm="'+i+'" aria-label="Remove">&times;</button>'+
      '</div>';
    }).join("");
    var total = r.moves.reduce(function(a,b){ return a+b.secs; },0);
    return '<div class="scrim"><div class="sheet" role="dialog" aria-modal="true">'+
      '<h3>Change the routine</h3>'+
      '<div class="field"><label for="r-name">Name</label><input id="r-name" value="'+esc(r.name)+'" data-rf="name"></div>'+
      '<div class="field"><label>Moves and minutes &middot; 0 means no time limit</label>'+rows+
        '<button class="linky" data-mvadd="1">+ add a move</button></div>'+
      '<div class="field" style="color:var(--dim);font-size:13px">Comes to '+mmss(total)+'.</div>'+
      '<div class="sheet-foot">'+
        '<button class="solid" data-rsave="1">Save routine</button>'+
        '<button class="ghost" data-rcancel="1">Cancel</button>'+
      '</div>'+
    '</div></div>';
  }

  function rosterSection(){
    var list = state.roster.map(function(m){
      return '<button class="task" data-edit="'+m.id+'" style="border-top:1px solid var(--line)">'+
        '<span class="dot" style="background:'+m.hue+';width:9px;height:9px"></span>'+
        '<span class="label">'+esc(m.name)+'</span>'+
        '<span class="meta">edit</span>'+
      '</button>';
    }).join("");
    return '<section>'+
      '<div class="head"><h2>Who&rsquo;s in</h2></div>'+
      '<div class="card" style="padding-top:2px">'+list+'</div>'+
      '<button class="ghost" data-new="1">Add someone</button>'+
    '</section>';
  }

  function editor(){
    if(!state.editing) return "";
    var m = state.editing, isNew = !state.roster.some(function(x){ return x.id === m.id; });
    var daily = m.daily.map(function(h,i){
      return '<div class="hab"><input value="'+esc(h.label)+'" data-hab="daily" data-i="'+i+'" placeholder="e.g. Morning routine (10 min)">'+
        '<button data-rm="daily" data-i="'+i+'" aria-label="Remove">&times;</button></div>';
    }).join("");
    var weekly = m.weekly.map(function(h,i){
      return '<div class="hab"><input value="'+esc(h.label)+'" data-hab="weekly" data-i="'+i+'" placeholder="e.g. Weights">'+
        '<input type="number" min="1" max="7" value="'+h.times+'" data-times="'+i+'" aria-label="Times per week">'+
        '<button data-rm="weekly" data-i="'+i+'" aria-label="Remove">&times;</button></div>';
    }).join("");
    var sw = HUES.map(function(h){
      return '<button class="swatch" style="background:'+h+'" data-hue="'+h+'" aria-pressed="'+(h===m.hue)+'" aria-label="Colour"></button>';
    }).join("");
    return '<div class="scrim" data-scrim="1"><div class="sheet" role="dialog" aria-modal="true">'+
      '<h3>'+(isNew ? "Add someone" : esc(m.name))+'</h3>'+
      '<div class="field"><label for="f-name">Name</label><input id="f-name" value="'+esc(m.name)+'" data-f="name" placeholder="First name"></div>'+
      '<div class="field"><label for="f-goal">Pounds to lose by 1 June</label><input id="f-goal" type="number" min="0" step="1" value="'+(m.goalLbs||"")+'" data-f="goalLbs" placeholder="20"></div>'+
      '<div class="field"><label for="f-start">Starting weight in lb (optional)</label><input id="f-start" type="number" step="0.1" value="'+(m.start||"")+'" data-f="start" placeholder="Leave blank to skip"></div>'+
      '<div class="field"><label>Every day</label>'+daily+'<button class="linky" data-add="daily">+ add a daily habit</button></div>'+
      '<div class="field"><label>Every week</label>'+weekly+'<button class="linky" data-add="weekly">+ add a weekly habit</button></div>'+
      '<div class="field"><label>Colour</label><div class="swatches">'+sw+'</div></div>'+
      '<div class="sheet-foot">'+
        '<button class="solid" data-save="1">'+(isNew ? "Add to the challenge" : "Save changes")+'</button>'+
        '<button class="ghost" data-cancel="1">Cancel</button>'+
        (isNew ? "" : '<button class="linky" data-del="1" style="margin-left:auto">Remove</button>')+
      '</div>'+
    '</div></div>';
  }

  function draw(){
    var body;
    if(state.tab === "pre"){
      body = preSection();
    } else if(state.tab === "season"){
      body = seasonSection();
    } else if(state.tab === "workouts"){
      body = workoutsSection();
    } else {
      body = notice() + todaySection() + rosterSection() +
        '<div class="fine">Everyone using this page sees the same entries &mdash; that&rsquo;s the point, but it does mean weights are shared. Leave the weight fields blank if you&rsquo;d rather only track habits.</div>';
    }
    document.getElementById("root").innerHTML =
      masthead() + tabsNav() + body + editor() + routineEditor();
  }

  /* ---------- timer engine ---------- */
  var tick = null, actx = null;

  function beep(hz, ms){
    try{
      if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      var o = actx.createOscillator(), g = actx.createGain();
      o.connect(g); g.connect(actx.destination);
      o.frequency.value = hz; o.type = "sine";
      g.gain.setValueAtTime(0.0001, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.22, actx.currentTime + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + ms/1000);
      o.start(); o.stop(actx.currentTime + ms/1000 + 0.02);
    }catch(e){}
  }

  function paint(){
    var c = document.getElementById("t-clock");
    if(!c) return;
    var total = routineTotal(), el = elapsedSecs();
    c.textContent = mmss(state.timer.left);
    var b = document.getElementById("t-bar");
    if(b) b.style.width = (total ? Math.round((el/total)*100) : 0)+"%";
    var o = document.getElementById("t-of");
    if(o) o.textContent = mmss(el)+" of "+mmss(total);
  }

  function stopTimer(){ if(tick){ clearInterval(tick); tick = null; } state.timer.on = false; }

  function runTimer(){
    var r = state.routine.moves;
    if(!state.timer.left) state.timer.left = r[state.timer.i].secs || 0;
    state.timer.on = true; state.timer.done = false;
    if(tick) clearInterval(tick);
    tick = setInterval(function(){
      if(isOpen(r[state.timer.i])){ state.timer.left++; paint(); return; }
      state.timer.left--;
      if(state.timer.left > 0){
        if(state.timer.left <= 3) beep(660, 90);
        paint();
        return;
      }
      state.timer.i++;
      if(state.timer.i >= r.length){
        beep(880, 380);
        stopTimer();
        state.timer.done = true; state.timer.left = 0;
        draw();
      } else {
        beep(880, isBreak(r[state.timer.i]) ? 120 : 180);
        state.timer.left = r[state.timer.i].secs || 0;
        draw();
      }
    }, 1000);
    draw();
  }

  function resetTimer(){
    stopTimer();
    var first = state.routine && state.routine.moves[0];
    state.timer = { on:false, i:0, left: first ? (first.secs || 0) : 0, done:false };
  }

  /* ---------- events ---------- */
  document.addEventListener("click", async function(e){
    var t = e.target.closest("button");
    if(!t) return;

    if(t.dataset.tab){
      if(state.tab !== t.dataset.tab){ stopTimer(); state.tab = t.dataset.tab; state.warn = ""; draw(); }
      return;
    }

    if(t.dataset.tplay){
      if(state.timer.on){ stopTimer(); draw(); } else { runTimer(); }
      return;
    }
    if(t.dataset.tdone){ beep(880, 380); stopTimer(); state.timer.done = true; draw(); return; }
    if(t.dataset.treset){ resetTimer(); draw(); return; }
    if(t.dataset.tskip){
      var mv = state.routine.moves;
      stopTimer();
      state.timer.i++;
      if(state.timer.i >= mv.length){ state.timer.done = true; state.timer.left = 0; }
      else state.timer.left = mv[state.timer.i].secs || 0;
      draw();
      return;
    }

    if(t.dataset.credit){
      var cid = t.dataset.credit, slot = t.dataset.slot, dk = today();
      if(!inAny(dk)){ flash("Today falls outside both the pre-season and the challenge, so there's nothing to log."); return; }
      var clog = state.logs[cid] || (state.logs[cid] = blankLog());
      var crec = clog.days[dk] || (clog.days[dk] = []);
      if(crec.indexOf(slot) === -1) crec.push(slot);
      if(inPre(dk)){ state.tab = "pre"; state.preCursor = dk; } else { state.tab = "today"; state.cursor = dk; }
      resetTimer(); draw();
      await saveLog(cid);
      return;
    }

    if(t.dataset.restart){
      var rm = state.roster.filter(function(x){ return x.id === t.dataset.restart; })[0];
      var wv = weightNow(rm);
      if(rm && wv != null){ rm.start = wv; draw(); await saveRoster(); }
      return;
    }

    if(t.dataset.editr){ state.editRoutine = JSON.parse(JSON.stringify(state.routine)); draw(); return; }
    if(t.dataset.mvadd){ state.editRoutine.moves.push({label:"",secs:60}); draw(); return; }
    if(t.dataset.mvrm){ state.editRoutine.moves.splice(+t.dataset.mvrm,1); draw(); return; }
    if(t.dataset.rcancel){ state.editRoutine = null; draw(); return; }
    if(t.dataset.rsave){
      var nr = state.editRoutine;
      nr.moves = nr.moves.filter(function(x){ return x.label.trim(); });
      if(!nr.moves.length){ flash("A routine needs at least one move."); return; }
      if(!nr.name.trim()) nr.name = "The routine";
      state.routine = nr; state.editRoutine = null;
      resetTimer(); state.warn = "";
      draw(); await saveRoutine();
      return;
    }

    if(t.dataset.step){
      var w = t.dataset.which, b = bounds(w);
      var next = shift(cursorOf(w), +t.dataset.step);
      if(next >= b[0] && next <= b[1] && !isFuture(next)){
        if(w === "pre") state.preCursor = next; else state.cursor = next;
        draw();
      }
      return;
    }

    if(t.dataset.who){
      var id = t.dataset.who, item = t.dataset.item, d = t.dataset.day;
      var log = state.logs[id] || (state.logs[id] = blankLog());
      var rec = log.days[d] || (log.days[d] = []);
      var at = rec.indexOf(item);
      if(at > -1) rec.splice(at,1); else rec.push(item);
      if(!rec.length) delete log.days[d];
      draw(); await saveLog(id);
      return;
    }

    if(t.dataset.logw){
      var mid = t.dataset.logw;
      var input = document.querySelector('input[data-w="'+mid+'"]');
      var v = parseFloat(input && input.value);
      if(isNaN(v) || v <= 0){ flash("Enter a weight in pounds, like 168.5."); return; }
      var lg = state.logs[mid] || (state.logs[mid] = blankLog());
      lg.weights = lg.weights || {};
      lg.weights[today()] = v;
      var person = state.roster.filter(function(x){ return x.id === mid; })[0];
      if(person && !person.start){ person.start = v; await saveRoster(); }
      state.warn = "";
      draw(); await saveLog(mid);
      return;
    }

    if(t.dataset.new){
      var used = state.roster.map(function(x){ return x.hue; });
      var hue = HUES.filter(function(h){ return used.indexOf(h) === -1; })[0] || HUES[0];
      state.editing = { id:"p"+Date.now(), name:"", hue:hue, goalLbs:20, start:null,
        daily:[{id:"am",label:"Morning routine (10 min)"},{id:"pm",label:"Evening routine (10 min)"}], weekly:[] };
      draw(); return;
    }

    if(t.dataset.edit){
      var found = state.roster.filter(function(x){ return x.id === t.dataset.edit; })[0];
      state.editing = JSON.parse(JSON.stringify(found));
      draw(); return;
    }

    if(t.dataset.hue){ state.editing.hue = t.dataset.hue; draw(); return; }

    if(t.dataset.add){
      var k2 = t.dataset.add;
      var uid = k2.charAt(0)+Date.now().toString(36).slice(-4);
      if(k2 === "daily") state.editing.daily.push({id:uid,label:""});
      else state.editing.weekly.push({id:uid,label:"",times:3});
      draw(); return;
    }

    if(t.dataset.rm){ state.editing[t.dataset.rm].splice(+t.dataset.i,1); draw(); return; }

    if(t.dataset.cancel || t.dataset.scrim){ state.editing = null; draw(); return; }

    if(t.dataset.del){
      var rid = state.editing.id;
      state.roster = state.roster.filter(function(x){ return x.id !== rid; });
      state.editing = null;
      draw(); await saveRoster();
      if(has()){ try{ await window.storage.delete("fc:log:"+rid, true); }catch(err){} }
      return;
    }

    if(t.dataset.save){
      var m = state.editing;
      if(!m.name.trim()){ flash("Give this person a name first."); return; }
      m.daily = m.daily.filter(function(h){ return h.label.trim(); });
      m.weekly = m.weekly.filter(function(h){ return h.label.trim(); });
      var i = -1;
      state.roster.forEach(function(x,ix){ if(x.id === m.id) i = ix; });
      if(i > -1) state.roster[i] = m; else { state.roster.push(m); state.logs[m.id] = state.logs[m.id] || blankLog(); }
      state.editing = null; state.warn = "";
      draw(); await saveRoster();
      return;
    }
  });

  document.addEventListener("click", function(e){
    if(e.target.classList && e.target.classList.contains("scrim")){ state.editing = null; state.editRoutine = null; draw(); }
  });

  document.addEventListener("input", function(e){
    var el = e.target;

    if(state.editRoutine){
      if(el.dataset.rf === "name") state.editRoutine.name = el.value;
      if(el.dataset.mv !== undefined) state.editRoutine.moves[+el.dataset.mv].label = el.value;
      if(el.dataset.mvm !== undefined){
        var mins = parseFloat(el.value);
        state.editRoutine.moves[+el.dataset.mvm].secs = (isNaN(mins) || mins < 0) ? 0 : Math.round(mins*60);
      }
      return;
    }

    if(!state.editing) return;
    if(el.dataset.f){
      var f = el.dataset.f;
      if(f === "goalLbs") state.editing.goalLbs = el.value === "" ? 0 : parseFloat(el.value);
      else if(f === "start") state.editing.start = el.value === "" ? null : parseFloat(el.value);
      else state.editing.name = el.value;
    }
    if(el.dataset.hab) state.editing[el.dataset.hab][+el.dataset.i].label = el.value;
    if(el.dataset.times) state.editing.weekly[+el.dataset.times].times = Math.max(1, Math.min(7, +el.value || 1));
  });

  document.addEventListener("keydown", function(e){
    if(e.key === "Escape" && (state.editing || state.editRoutine)){ state.editing = null; state.editRoutine = null; draw(); }
  });

  /* ---------- boot ---------- */
  (async function(){
    document.getElementById("root").innerHTML = masthead() +
      '<div class="notice"><p>Loading everyone&rsquo;s entries&hellip;</p></div>';
    await load();
    var t = today();
    state.cursor = t < START ? START : (t > END ? END : t);
    state.preCursor = t < PRE_START ? PRE_START : (t > PRE_END ? PRE_END : t);
    state.tab = t < START ? "pre" : "today";
    resetTimer();
    state.ready = true;
    draw();
  })();
})();
</script>
